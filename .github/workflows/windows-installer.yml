name: Build K99 Windows Installer

on:
  workflow_dispatch:

jobs:
  windows-installer:
    name: windows-installer
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate hosted C++ tools and Windows SDK
        run: |
          Get-Command cl.exe -ErrorAction SilentlyContinue | Out-Null
          Write-Host "Host toolchain checked"

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Prepare pnpm 10.26.1
        uses: pnpm/action-setup@v3
        with:
          version: 10.26.1

      - name: Extract Build Kit and Synchronize Paths
        run: |
          Expand-Archive -Path "source/K99-Windows-V1-0.3.0-Windows-Build-Kit.zip" -DestinationPath "." -Force
          
          # build 경로를 요구하는 스크립트를 위해 artifacts 폴더 전체를 build/ 하위로 안전 동기화
          New-Item -ItemType Directory -Force -Path "build/artifacts"
          Copy-Item -Recurse -Force "artifacts/*" "build/artifacts/"

      - name: Install exact source dependencies
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build and verify declarations directly with TypeScript
        run: |
          node scripts/build-desktop-declarations.cjs

      - name: Check React source types
        run: |
          pnpm --filter @k99/windows typecheck

      - name: Build Desktop Frontend Bundle
        env:
          PORT: 5000
          NODE_ENV: production
        run: |
          Set-Location artifacts/k99-windows
          npx vite build --config vite.desktop.config.ts --outDir dist/desktop
          Set-Location ../..

      - name: Stage Windows App Assets
        run: |
          node scripts/stage-windows-app.cjs

      - name: Compile installer and uninstaller customizations with NSIS
        run: |
          node scripts/verify-nsis-customization.cjs

      - name: Build Windows x64 NSIS EXE
        run: |
          node scripts/build-windows-installer.cjs

      - name: Verify x64 payload and packaged SQLite Electron ABI
        run: |
          node scripts/verify-packaged-native.cjs

      - name: Measure actual installer bytes and SHA-256
        run: |
          node scripts/verify-windows-installer.cjs

      - name: Upload verified EXE and evidence
        uses: actions/upload-artifact@v4
        with:
          name: K99-Windows-V1-0.3.0-x64
          path: |
            dist/*.exe
            build-manifest.json
            electron-abi-result.json

      - name: Preserve builder diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: K99-builder-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/generated-artifacts/windows-installer/builder-debug.yml
            build/generated-artifacts/windows-installer/builder-effective-config.yaml
            build/generated-artifacts/windows-installer/packaging-stages.log
            build/generated-artifacts/windows-installer/packaging-console.log
            build/generated-artifacts/nsis-customization-check/*.log
            build/generated-artifacts/nsis-customization-check/report.json
